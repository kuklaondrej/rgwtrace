name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1 # 1.90.0
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Install Linux build and fixture dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libelf-dev linux-libc-dev llvm pkg-config zlib1g-dev g++ dwz binutils libbpf-dev
      - name: Install bpftool
        if: runner.os == 'Linux'
        # On Ubuntu 24.04 `bpftool` is a virtual package: the real binary ships
        # in the kernel-flavour-specific linux-tools package and is reached
        # through the linux-tools-common wrapper. Hosted runners boot an Azure
        # kernel, so install that flavour and fall back to the generic one.
        run: |
          sudo apt-get install -y --no-install-recommends linux-tools-common
          sudo apt-get install -y --no-install-recommends "linux-tools-$(uname -r)" \
            || sudo apt-get install -y --no-install-recommends linux-tools-generic
          # The wrapper execs /usr/lib/linux-tools/$(uname -r)/bpftool; when only
          # the generic flavour is installed, point that path at its binary.
          if ! bpftool version >/dev/null 2>&1; then
            real=$(find /usr/lib/linux-tools-* -maxdepth 1 -name bpftool -type f | sort -V | tail -n 1)
            test -n "$real" || { echo 'no bpftool binary found' >&2; exit 1; }
            sudo mkdir -p "/usr/lib/linux-tools/$(uname -r)"
            sudo ln -sf "$real" "/usr/lib/linux-tools/$(uname -r)/bpftool"
          fi
          bpftool version
      - name: Require Linux DWARF fixture coverage
        if: matrix.os == 'ubuntu-24.04'
        run: echo 'RGWTRACE_REQUIRE_DWARF_FIXTURES=1' >> "$GITHUB_ENV"
      - name: Verify workspace and JSON verifier
        run: scripts/verify.sh
      - name: Release packaging tests
        run: python3 -m unittest discover -s tests -p 'test_release.py'
      - name: Release build
        run: cargo build --workspace --locked --release
      - name: Load BPF programs on the hosted Linux kernel
        if: runner.os == 'Linux'
        run: sudo scripts/verify-bpf-load.sh

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1 # 1.90.0
        with:
          toolchain: 1.90.0
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny yanked --deny unmaintained

  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned workflow and secret scanners
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Check committed whitespace
        run: |
          empty_tree=$(git hash-object -w -t tree /dev/null)
          git diff --check "$empty_tree" HEAD
      - name: Validate workflows
        run: '"$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml docs/lab/workflows/*.yml'
      - name: Scan reachable Git history for secrets
        run: '"$(go env GOPATH)/bin/gitleaks" git --redact --log-opts="--all"'

  # Keep one stable required check; a skipped/cancelled matrix or audit is not green.
  rust:
    if: always()
    needs: [check, audit, policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: test "$CHECK_RESULT" = success && test "$AUDIT_RESULT" = success && test "$POLICY_RESULT" = success

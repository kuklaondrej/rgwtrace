name: E2E

on:
  workflow_dispatch:
    inputs:
      microceph_channel:
        description: MicroCeph snap channel
        default: reef/stable
        required: true
      microceph_expected_ceph_version:
        description: Expected Ceph package version in the MicroCeph snap
        default: 18.2.4-0ubuntu1~cloud0
        required: true

jobs:
  microceph-rgw:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bpftool clang curl libbpf-dev libelf-dev linux-libc-dev llvm pkg-config python3-boto3 snapd zlib1g-dev
      - name: Build release binary
        run: cargo build --release
      - name: Verify BPF load
        run: sudo scripts/verify-bpf-load.sh
      - name: Run MicroCeph RGW e2e
        run: sudo MICROCEPH_CHANNEL='${{ inputs.microceph_channel }}' MICROCEPH_EXPECTED_CEPH_VERSION='${{ inputs.microceph_expected_ceph_version }}' tests/e2e/functional-test-microceph-rgw.sh
      - name: Stage e2e artifacts
        if: always()
        run: |
          mkdir -p e2e-artifacts
          sudo cp -a /tmp/rgwtrace-e2e/. e2e-artifacts/ 2>/dev/null || true
          sudo chown -R "$USER" e2e-artifacts
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: microceph-rgw-e2e-artifacts
          path: e2e-artifacts/
          retention-days: 14
          if-no-files-found: ignore

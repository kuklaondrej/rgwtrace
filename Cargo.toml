[package]
name = "rgwtrace"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
build = "build.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
libbpf-rs = "0.24"
libc = "0.2"

[target.'cfg(target_os = "linux")'.build-dependencies]
libbpf-cargo = "0.24"

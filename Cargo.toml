[workspace]
# The root package is the implicit primary member; `bench` is an additive,
# self-contained microbenchmark member (see bench/README.md). It reuses the
# root's dependency set, so this does not change the resolved dependency graph.
members = ["bench"]

[package]
name = "rgwtrace"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
build = "build.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
cpp_demangle = "0.4"
flate2 = "1.0"
gimli = "0.31"
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace"] }
object = { version = "0.39", default-features = false, features = ["read", "elf", "compression"] }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# Test-only TLS server for the --otlp-ca-cert trust test. Same crate, version
# and crypto provider (ring) reqwest's rustls-tls already compiles, so this
# adds no new dependency to the build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
libbpf-rs = "0.24"
libc = "0.2"

[target.'cfg(target_os = "linux")'.build-dependencies]
libbpf-cargo = "0.24"

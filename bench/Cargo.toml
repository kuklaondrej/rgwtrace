# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "rgwtrace-bench"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
build = "build.rs"
publish = false

[[bin]]
name = "rgwtrace-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
libbpf-rs = "0.27"
libc = "0.2"

[target.'cfg(target_os = "linux")'.build-dependencies]
libbpf-cargo = "0.24"

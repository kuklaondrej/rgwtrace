name: E2E

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed full commit SHA in kuklaondrej/rgwtrace
        required: true
      baseline_get_rate:
        description: Measured baseline/no-END GET coverage requirement (0 < rate <= 1)
        required: true
      baseline_put_rate:
        description: Measured baseline/no-END PUT coverage requirement (0 < rate <= 1)
        required: true
      cross_thread_get_rate:
        description: Measured cross-thread GET coverage requirement (0 < rate <= 1)
        required: true
      cross_thread_put_rate:
        description: Measured cross-thread PUT coverage requirement (0 < rate <= 1)
        required: true
      microceph_channel:
        description: MicroCeph snap channel
        default: reef/stable
        required: true
      microceph_expected_ceph_version:
        description: Expected Ceph package version in the MicroCeph snap
        default: 18.2.4-0ubuntu1~cloud0
        required: true

concurrency:
  group: microceph-rgw-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  microceph-rgw:
    if: github.event.repository.private
    environment: privileged-tests
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [baseline, cross-thread, no-end]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    env:
      E2E_VM_ARTIFACT_DIR: /tmp/rgwtrace-e2e
      E2E_VM_IMAGE: ubuntu:24.04
      E2E_VM_NAME: rgwtrace-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
    steps:
      - name: Validate reviewed revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: kuklaondrej/rgwtrace
          ref: ${{ inputs.source_sha }}
      - name: Verify LXD sandbox support
        run: |
          if ! command -v lxc >/dev/null 2>&1; then
            printf 'lxc was not found. Install and initialize LXD on the self-hosted runner before running this workflow.\n' >&2
            exit 1
          fi
          if ! lxc info >/dev/null 2>&1; then
            printf 'lxc cannot talk to LXD. Ensure LXD is initialized and the runner user is in the lxd group.\n' >&2
            exit 1
          fi
      - name: Launch E2E sandbox VM
        run: |
          if lxc info "${E2E_VM_NAME}" >/dev/null 2>&1; then
            lxc delete "${E2E_VM_NAME}" --force
          fi
          lxc launch "${E2E_VM_IMAGE}" "${E2E_VM_NAME}" --vm \
            -c limits.cpu=4 \
            -c limits.memory=8GiB \
            -d root,size=35GiB
          for _ in {1..120}; do
            if lxc exec "${E2E_VM_NAME}" -- true >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          lxc exec "${E2E_VM_NAME}" -- true
          lxc exec "${E2E_VM_NAME}" -- cloud-init status --wait
      - name: Install sandbox dependencies
        run: |
          lxc exec "${E2E_VM_NAME}" -- bash -euxo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends bpftool build-essential ca-certificates clang curl libbpf-dev libelf-dev linux-libc-dev llvm pkg-config python3-boto3 snapd zlib1g-dev
            systemctl enable --now snapd.socket
            snap wait system seed.loaded
          '
      - name: Copy workspace to sandbox
        run: |
          lxc exec "${E2E_VM_NAME}" -- mkdir -p /root/rgwtrace/target/release
          tar --exclude=.git --exclude=target --exclude=e2e-artifacts -C "${GITHUB_WORKSPACE}" -cf - . \
            | lxc exec "${E2E_VM_NAME}" -- tar -C /root/rgwtrace -xf -
          git rev-parse HEAD > /tmp/rgwtrace-revision.txt
          lxc file push /tmp/rgwtrace-revision.txt "${E2E_VM_NAME}/root/rgwtrace/revision.txt"
      - name: Build inside the disposable VM
        run: |
          lxc exec "${E2E_VM_NAME}" -- bash -euo pipefail -c '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.90.0
            export PATH="/root/.cargo/bin:$PATH"
            cd /root/rgwtrace
            cargo build --release --locked
          '
      - name: Verify BPF load in sandbox
        run: |
          lxc exec "${E2E_VM_NAME}" -- bash -euxo pipefail -c '
            cd /root/rgwtrace
            scripts/verify-bpf-load.sh
          '
      - name: Run MicroCeph RGW e2e in sandbox
        env:
          E2E_PROFILE: ${{ matrix.profile }}
          REQUIRE_GET_READ_CORRELATION: ${{ matrix.profile == 'cross-thread' && inputs.cross_thread_get_rate || inputs.baseline_get_rate }}
          REQUIRE_PUT_WRITE_CORRELATION: ${{ matrix.profile == 'cross-thread' && inputs.cross_thread_put_rate || inputs.baseline_put_rate }}
          MICROCEPH_CHANNEL: ${{ inputs.microceph_channel }}
          MICROCEPH_EXPECTED_CEPH_VERSION: ${{ inputs.microceph_expected_ceph_version }}
        run: |
          lxc exec "${E2E_VM_NAME}" \
            --env E2E_PROFILE="${E2E_PROFILE}" \
            --env REQUIRE_GET_READ_CORRELATION="${REQUIRE_GET_READ_CORRELATION}" \
            --env REQUIRE_PUT_WRITE_CORRELATION="${REQUIRE_PUT_WRITE_CORRELATION}" \
            --env MICROCEPH_CHANNEL="${MICROCEPH_CHANNEL}" \
            --env MICROCEPH_EXPECTED_CEPH_VERSION="${MICROCEPH_EXPECTED_CEPH_VERSION}" \
            --env ARTIFACT_DIR="${E2E_VM_ARTIFACT_DIR}" \
            -- bash -euxo pipefail -c '
              cd /root/rgwtrace
              tests/e2e/functional-test-microceph-rgw.sh
            '
      - name: Stage e2e artifacts
        if: always()
        run: |
          rm -rf e2e-artifacts
          mkdir -p e2e-artifacts
          if command -v lxc >/dev/null 2>&1 && lxc info "${E2E_VM_NAME}" >/dev/null 2>&1; then
            lxc file pull --recursive "${E2E_VM_NAME}${E2E_VM_ARTIFACT_DIR}" e2e-artifacts/ || true
          fi
      - name: Destroy E2E sandbox VM
        if: always()
        run: |
          if command -v lxc >/dev/null 2>&1 && lxc info "${E2E_VM_NAME}" >/dev/null 2>&1; then
            lxc delete "${E2E_VM_NAME}" --force
          fi
      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: microceph-rgw-e2e-artifacts-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
          path: e2e-artifacts/
          retention-days: 14
          if-no-files-found: ignore
